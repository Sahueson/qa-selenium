[pytest]
# Selenium + Python + pytest contra Tactical Calendar (staging). Mismos casos que qa-playwright.
# Ejecutar una suite: pytest tests/a-auth
testpaths = tests
markers =
    case(name): nombre del caso tal como sale en la web (p. ej. "TC-A01 Jugador con equipo entra...")
addopts = -p no:cacheprovider
